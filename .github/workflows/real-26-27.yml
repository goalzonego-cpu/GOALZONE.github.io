name: Real 26-27 LaLiga y Premier
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Actualiza tablas reales 26/27
        run: |
          python3 - << 'PY'
          import urllib.request, json
          from datetime import datetime

          def fetch(league, out):
              # Sin?season= para que coja la actual 26/27 automaticamente
              url = f"https://site.api.espn.com/apis/v2/sports/soccer/{league}/standings"
              print(f"Bajando {url}")
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read().decode())

              # ESPN mete la tabla en children[0]
              entries = data['children'][0]['standings']['entries']
              result = {'actualizado': datetime.utcnow().strftime('%d/%m %H:%M UTC'), 'tabla': []}
              for e in entries:
                  team = e['team']['displayName']
                  stats = {s['name']: s['value'] for s in e['stats']}
                  result['tabla'].append({
                      'pos': int(stats.get('rank', 0)),
                      'team': team,
                      'pj': int(stats.get('gamesPlayed', 0)),
                      'pts': int(stats.get('points', 0)),
                      'dg': int(stats.get('pointDifferential', 0))
                  })
              result['tabla'] = sorted(result['tabla'], key=lambda x: x['pos'])
              with open(out, 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False)
              print(f"{out} OK -> {result['tabla'][0]['team']} primero")

          fetch('esp.1', 'laliga-data.json')
          fetch('eng.1', 'premier-data.json')
          PY

      - name: Guardar
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add laliga-data.json premier-data.json
          git diff --staged --quiet || git commit -m "tablas 26/27 reales"
          git push
