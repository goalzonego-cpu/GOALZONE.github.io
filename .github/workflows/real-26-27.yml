name: GoalZone Real 26-27 FULL
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch 26/27
        run: |
          python3 -m pip install requests -q
          python3 << 'PY'
          import requests, json, datetime
          def get(code, out):
            url=f"https://site.api.espn.com/apis/v2/sports/soccer/{code}/standings?season=2026"
            r=requests.get(url, timeout=20).json()
            tabla=[]
            for e in r['children'][0]['standings']['entries']:
              t=e['team']
              tid=t.get('id','')
              s={x['name']:x['value'] for x in e['stats']}
              logo=f"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F{tid}.png&w=100&h=100"
              tabla.append({"pos":s.get('rank',0),"team":t['displayName'],"logo":logo,"pj":s.get('gamesPlayed',0),"pts":s.get('points',0)})
            tabla=sorted(tabla,key=lambda x:x['pos'])
            open(out,'w',encoding='utf-8').write(json.dumps({"actualizado":datetime.datetime.utcnow().strftime("%d/%m %H:%M"),"tabla":tabla},ensure_ascii=False,indent=2))
            print(f"{code} OK")
          get('esp.1','laliga-data.json')
          get('eng.1','premier-data.json')
          open('laliga-goleadores.json','w').write('{"goleadores":[]}')
          open('premier-goleadores.json','w').write('{"goleadores":[]}')
          open('laliga-partidos.json','w').write('{"partidos":[]}')
          open('premier-partidos.json','w').write('{"partidos":[]}')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@goalzone.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "fix escudos" && git push)
