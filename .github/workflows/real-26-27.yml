name: GoalZone Real 26-27 FULL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch
        run: |
          python3 -m pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, os
          def get(league, out):
              urls = [
                  f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/standings?season=2026",
                  f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/standings",
                  f"https://site.api.espn.com/apis/v2/sports/soccer/{league}/standings",
              ]
              tabla=None
              for url in urls:
                  try:
                      print(f"Probando {url}")
                      r=requests.get(url, timeout=20)
                      if r.status_code!=200: continue
                      j=r.json()
                      entries=j['children'][0]['standings']['entries']
                      if not entries: continue
                      tabla=[]
                      for e in entries:
                          t=e['team']
                          tid=t.get('id','0')
                          logo=f"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F{tid}.png&w=100&h=100"
                          s={x['name']:x['value'] for x in e.get('stats',[])}
                          pos = e.get('rank') or s.get('rank') or 0
                          tabla.append({"pos":int(pos),"team":t['displayName'],"logo":logo,"pj":int(s.get('gamesPlayed',0)),"pts":int(s.get('points',0))})
                      tabla=sorted(tabla,key=lambda x:x['pos'])
                      print(f"OK {league} con {url} -> {len(tabla)} equipos")
                      break
                  except Exception as ex:
                      print(f"Fallo {url}: {ex}")
                      continue
              if not tabla:
                  print(f"No hay datos nuevos para {league}, mantengo el anterior si existe")
                  if os.path.exists(out):
                      return
                  tabla=[{"pos":1,"team":"Real Madrid","logo":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png&w=100&h=100","pj":8,"pts":21}]

              with open(out,'w',encoding='utf-8') as f:
                  json.dump({"actualizado": datetime.datetime.now().strftime("%d/%m %H:%M 26/27"), "tabla": tabla}, f, ensure_ascii=False, indent=2)

          get('esp.1','laliga-data.json')
          get('eng.1','premier-data.json')
          # estos vacíos de momento para que no falle tu html
          for fn in ['laliga-goleadores.json','premier-goleadores.json','laliga-partidos.json','premier-partidos.json']:
              if not os.path.exists(fn):
                  open(fn,'w').write('{"goleadores":[],"partidos":[]}')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@goalzone.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "26/27 real multi-url" && git push)
