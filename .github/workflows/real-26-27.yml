name: Real 26-27 LaLiga y Premier
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualiza tablas reales 26/27
        run: |
          python3 - << 'PY'
          import urllib.request, json
          from datetime import datetime
          import sys
          def fetch(league, out):
              url = f"https://site.api.espn.com/apis/v2/sports/soccer/{league}/standings?season=2026"
              print(f"Bajando {url}")
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.loads(r.read().decode())
              except Exception as e:
                  print(f"Error {league}: {e}")
                  sys.exit(1)
              entries = data['children'][0]['standings']['entries']
              result = {'actualizado': datetime.utcnow().strftime('%d/%m %H:%M UTC'), 'tabla': []}
              for e in entries:
                  team = e['team']['displayName']
                  stats = {s['name']: s['value'] for s in e['stats']}
                  result['tabla'].append({
                      'pos': int(stats.get('rank', 0)),
                      'team': team,
                      'pj': int(stats.get('gamesPlayed', 0)),
                      'pts': int(stats.get('points', 0)),
                      'dg': int(stats.get('pointDifferential', 0))
                  })
              result['tabla'] = sorted(result['tabla'], key=lambda x: x['pos'])
              with open(out, 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False)
              print(f"{out} OK -> {len(result['tabla'])} equipos, primero: {result['tabla'][0]['team']}")

          fetch('esp.1', 'laliga-data.json')
          fetch('eng.1', 'premier-data.json')
          PY
      - name: Commit
        run: |
          git config user.name "bot-tablas"
          git config user.email "bot@goalzone.com"
          git add laliga-data.json premier-data.json
          git diff --staged --quiet || git commit -m "Tablas 26/27 reales actualizadas"
          git push
