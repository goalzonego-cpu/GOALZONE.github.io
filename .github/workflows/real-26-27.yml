name: GoalZone Real 26-27 FULL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch real standings
        run: |
          python3 -m pip install requests -q
          python3 << 'PY'
          import requests, json, datetime
          def get(league, out):
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/standings"
              print(f"Fetching {url}")
              r = requests.get(url, timeout=20)
              print(r.status_code)
              data = r.json()
              tabla=[]
              # nueva estructura ESPN site/v2
              try:
                  entries = data['children'][0]['standings']['entries']
              except:
                  # a veces viene directo
                  entries = data.get('standings', {}).get('entries', []) or data['children'][0]['standings']['entries']
              for e in entries:
                  t = e['team']
                  tid = t.get('id','')
                  logo = f"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F{tid}.png&w=100&h=100"
                  stats = {x['name']: x['value'] for x in e.get('stats', [])}
                  # rank puede venir en stats o fuera
                  pos = e.get('rank') or stats.get('rank') or len(tabla)+1
                  tabla.append({
                    "pos": int(pos),
                    "team": t.get('displayName',''),
                    "logo": logo,
                    "pj": int(stats.get('gamesPlayed', 0)),
                    "pts": int(stats.get('points', stats.get('pts', 0)))
                  })
              tabla = sorted(tabla, key=lambda x: x['pos'])
              print(f"{league} -> {len(tabla)} equipos")
              with open(out,'w',encoding='utf-8') as f:
                  json.dump({"actualizado": datetime.datetime.now().strftime("%d/%m %H:%M"), "tabla": tabla}, f, ensure_ascii=False, indent=2)

          get('esp.1','laliga-data.json')
          get('eng.1','premier-data.json')
          open('laliga-goleadores.json','w').write('{"goleadores":[]}')
          open('premier-goleadores.json','w').write('{"goleadores":[]}')
          open('laliga-partidos.json','w').write('{"partidos":[]}')
          open('premier-partidos.json','w').write('{"partidos":[]}')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@goalzone.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "real standings fix" && git push)
