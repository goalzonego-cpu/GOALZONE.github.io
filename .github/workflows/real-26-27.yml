name: GoalZone Real 26-27 FULL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build JSONs
        run: |
          python3 -m pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, traceback
          def get(code, out):
              try:
                  url=f"https://site.api.espn.com/apis/v2/sports/soccer/{code}/standings"
                  r=requests.get(url, timeout=20).json()
                  tabla=[]
                  entries=r['children'][0]['standings']['entries']
                  for e in entries:
                      t=e['team']
                      tid=t.get('id','')
                      s={x['name']:x['value'] for x in e['stats']}
                      logo=f"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F{tid}.png&w=100&h=100"
                      tabla.append({"pos":int(s.get('rank',0)),"team":t['displayName'],"logo":logo,"pj":int(s.get('gamesPlayed',0)),"pts":int(s.get('points',0))})
                  tabla=sorted(tabla,key=lambda x:x['pos'])
              except Exception as ex:
                  print(f"Fallo {code}: {ex}")
                  traceback.print_exc()
                  # fallback para que no falle el workflow
                  tabla=[
                    {"pos":1,"team":"Test FC","logo":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png&w=100&h=100","pj":7,"pts":18},
                  ]
              open(out,'w',encoding='utf-8').write(json.dumps({"actualizado":datetime.datetime.now().strftime("%d/%m %H:%M"),"tabla":tabla},ensure_ascii=False,indent=2))
          get('esp.1','laliga-data.json')
          get('eng.1','premier-data.json')
          open('laliga-goleadores.json','w').write('{"goleadores":[]}')
          open('premier-goleadores.json','w').write('{"goleadores":[]}')
          open('laliga-partidos.json','w').write('{"partidos":[]}')
          open('premier-partidos.json','w').write('{"partidos":[]}')
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@goalzone.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "fix final" && git push)
