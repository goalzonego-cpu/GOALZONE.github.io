name: GoalZone Real 26-27 FULL
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch all 26/27 data
        run: |
          import requests, json, datetime

          def fetch_standings(code, out):
            url = f"https://site.api.espn.com/apis/v2/sports/soccer/{code}/standings?season=2026"
            r = requests.get(url, timeout=20).json()
            tabla = []
            for entry in r['children'][0]['standings']['entries']:
              t = entry['team']
              team_id = t.get('id','')
              s = {st['name']: st['value'] for st in entry['stats']}
              logo = f"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F{team_id}.png&w=100&h=100"
              tabla.append({
                "pos": s.get('rank', 0),
                "team": t['displayName'],
                "logo": logo,
                "pj": s.get('gamesPlayed',0),
                "pts": s.get('points',0),
                "dif": s.get('pointDifferential',0)
              })
            tabla = sorted(tabla, key=lambda x: x['pos'])
            with open(out,'w',encoding='utf-8') as f:
              json.dump({"actualizado": datetime.datetime.utcnow().strftime("%d/%m %H:%M UTC"), "tabla": tabla}, f, ensure_ascii=False, indent=2)

          def fetch_scorers(code, out):
            try:
              url = f"https://site.api.espn.com/apis/v4/sports/soccer/{code}/statistics?season=2026"
              r = requests.get(url, timeout=20).json()
              leaders = []
              if 'stats' in r and 'goalsLeaders' in r['stats']:
                leaders = r['stats']['goalsLeaders']
              elif 'leaders' in r and 'goals' in r['leaders']:
                leaders = r['leaders']['goals']
              goleadores=[]
              for l in leaders[:15]:
                ath = l.get('athlete', l)
                if not ath: continue
                goleadores.append({
                  "jugador": ath.get('displayName',''),
                  "equipo": l.get('team',{}).get('displayName','') if isinstance(l.get('team'),dict) else '',
                  "goles": l.get('value', l.get('goals',0)),
                })
              with open(out,'w',encoding='utf-8') as f:
                json.dump({"actualizado": datetime.datetime.utcnow().strftime("%d/%m %H:%M UTC"), "goleadores": goleadores}, f, ensure_ascii=False, indent=2)
              return
            except Exception as e:
              print(f"scorers {code} error {e}")
            with open(out,'w',encoding='utf-8') as f:
              json.dump({"actualizado": "no disponible", "goleadores": []}, f)

          def fetch_matches(code, out):
            try:
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/{code}/scoreboard?dates=20260501-20270531"
              r = requests.get(url, timeout=20).json()
              partidos=[]
              for ev in r.get('events',[])[:10]:
                comp = ev['competitions'][0]
                partidos.append({
                  "fecha": ev['date'][:10],
                  "local": comp['competitors'][0]['team']['displayName'],
                  "visitante": comp['competitors'][1]['team']['displayName'],
                  "estado": comp['status']['type']['shortDetail']
                })
              with open(out,'w',encoding='utf-8') as f:
                json.dump({"partidos": partidos}, f, ensure_ascii=False, indent=2)
            except:
              with open(out,'w',encoding='utf-8') as f:
                json.dump({"partidos": []}, f)

          fetch_standings('esp.1','laliga-data.json')
          fetch_standings('eng.1','premier-data.json')
          fetch_scorers('esp.1','laliga-goleadores.json')
          fetch_scorers('eng.1','premier-goleadores.json')
          fetch_matches('esp.1','laliga-partidos.json')
          fetch_matches('eng.1','premier-partidos.json')

      - name: Commit
        run: |
          git config user.name "goalzone-bot"
          git config user.email "bot@goalzone.com"
          git add *.json
          git diff --staged --quiet || git commit -m "update 26/27 full con escudos fix"
          git push
