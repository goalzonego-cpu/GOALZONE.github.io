name: Tabla 26-27 SIN KEY
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baja tablas 26/27 ESPN real
        run: |
          pip install requests -q
          python3 -c "
          import requests, json
          from datetime import datetime
          def get(espn_code, salida):
              url=f'https://site.api.espn.com/apis/v2/sports/soccer/{espn_code}/standings?season=2026'
              print('Bajando', url)
              r=requests.get(url, timeout=20).json()
              tabla=r['children'][0]['standings']['entries']
              out={'actualizado': datetime.utcnow().strftime('%d/%m %H:%M UTC'), 'tabla': []}
              for e in tabla:
                  team=e['team']['displayName']
                  stats={s['name']: s['value'] for s in e['stats']}
                  out['tabla'].append({'pos': int(stats.get('rank',0)), 'team': team, 'pj': int(stats.get('gamesPlayed',0)), 'pts': int(stats.get('points',0)), 'dg': int(stats.get('pointDifferential',0))})
              out['tabla']=sorted(out['tabla'], key=lambda x: x['pos'])
              json.dump(out, open(salida,'w'), ensure_ascii=False)
              print(salida, 'OK', len(out['tabla']))
          get('esp.1', 'laliga-data.json')
          get('eng.1', 'premier-data.json')
          "
      - name: Guardar
        run: |
          git config user.name 'bot'
          git config user.email 'bot@bot.com'
          git add laliga-data.json premier-data.json
          git commit -m 'tablas 26/27 ESPN reales' || echo 'sin cambios'
          git push
