<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ligue 1 26/27 | GOALZONE</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a;color:#fff}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back-top{color:#fff;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #333;padding:10px 18px;border-radius:100px;background:#111}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top-bar{display:flex;gap:12px;align-items:center;margin:24px 0}.top-bar img{width:52px;height:52px;background:#fff;border-radius:14px;padding:7px}.season-bar{display:flex;gap:12px;align-items:center;background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:12px 16px;margin-bottom:18px}.season-bar select{background:#000;color:#fff;border:1px solid #333;border-radius:100px;padding:10px 18px;font-weight:700}.grid{display:grid;grid-template-columns:1.2fr.8fr;gap:18px}.box{background:#111;border:1px solid #1a1a1a;border-radius:18px;padding:22px}.table-row{display:grid;grid-template-columns:30px 1fr 40px 45px;font-size:13.5px;padding:11px 0;border-bottom:1px solid #1e1e1e;align-items:center}.team{display:flex;gap:10px;align-items:center}.team img{width:22px;height:22px;background:#fff;border-radius:100px;padding:2px}
.match-card{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1e1e1e}.match-teams{display:flex;flex-direction:column;gap:8px}.mt{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}.mt img{width:22px;height:22px;background:#fff;border-radius:50%;padding:2px}.match-center{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.score{font-weight:800;font-size:15px;background:#1a1a1a;padding:6px 12px;border-radius:100px;min-width:66px;text-align:center}.score.live{background:#E10600;color:#fff}.status{font-size:11px;color:#888;font-weight:700}.status.live{color:#E10600}.jornada-tag{background:#E10600;color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:100px;margin-bottom:12px;display:inline-block}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a href="index.html" class="logo"><img src="IMG_3855.png"></a><a href="index.html" class="back-top">← BACK</a></header>
<div class="wrap"><div class="top-bar"><img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F9.png"><div><h1 style="font-size:27px;font-weight:800">Ligue 1 26/27</h1><p style="color:#888;font-size:13px">Jornada actual en vivo como Google</p></div></div>
<div class="season-bar"><span style="font-size:11px;font-weight:800">ELIGE TEMPORADA:</span><select id="seasonSelect" onchange="cambiarTemporada()"></select><span id="loader" style="display:none;color:#E10600;font-size:12px;font-weight:700">● Cargando...</span></div>
<div class="grid"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:13px">RESULTADOS Y PARTIDOS</h2><span style="font-size:11px;color:#E10600;font-weight:800">● EN VIVO</span></div><div id="partidos">Cargando jornada actual 26/27...</div></div><div class="box"><h2 style="font-size:13px;margin-bottom:14px">CLASIFICACIÓN <span id="tempLabel" style="color:#E10600">26/27</span></h2><div class="table-row" style="color:#666;font-size:11px"><span>#</span><span>Equipo</span><span>PJ</span><span>PTS</span></div><div id="tabla">Cargando...</div></div></div></div>
<script>
const LIGA_CODE='fra.1';const sel=document.getElementById('seasonSelect');for(let y=2026;y>=2000;y--){let o=document.createElement('option');o.value=y;o.text=y+'/'+String(y+1).slice(-2);if(y==2026)o.selected=true;sel.appendChild(o);}
function pintar(t){document.getElementById('tabla').innerHTML=t.map(r=>`<div class="table-row"><span>${r.pos}</span><div class="team"><img src="${r.logo}"><span>${r.team}</span></div><span>${r.pj}</span><span><b>${r.pts}</b></span></div>`).join('');}
async function cargarTabla(s){document.getElementById('loader').style.display='inline';try{let j=await (await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${LIGA_CODE}/standings?season=${s}`)).json();let e=j.children[0].standings.entries;let tabla=e.map(x=>({pos:parseInt(x.stats.find(z=>z.name=='rank')?.value||0),team:x.team.displayName,logo:x.team.logos?.[0]?.href||'',pj:parseInt(x.stats.find(z=>z.name=='gamesPlayed'||z.name=='gp')?.value||0),pts:parseInt(x.stats.find(z=>z.name=='points'||z.name=='pts')?.value||0)})).sort((a,b)=>a.pos-b.pos);pintar(tabla);}catch{}document.getElementById('loader').style.display='none';}
function cambiarTemporada(){let s=sel.value;document.getElementById('tempLabel').innerText=s=='2026'?'26/27':s+'/'+String(parseInt(s)+1).slice(-2);cargarTabla(s);}
async function cargarJornadaActual(){try{let j=await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${LIGA_CODE}/scoreboard`)).json();let evs=j.events||[];if(!evs.length){document.getElementById('partidos').innerHTML='No hay partidos esta semana en 26/27';return;}evs.sort((a,b)=>{let sa=a.competitions[0].status.type.state,sb=b.competitions[0].status.type.state;if(sa=='in'&&sb!='in')return-1;if(sb=='in'&&sa!='in')return 1;return new Date(a.date)-new Date(b.date);});let html=`<span class="jornada-tag">JORNADA ACTUAL 26/27</span>`+evs.map(ev=>{let comp=ev.competitions[0],home=comp.competitors.find(c=>c.homeAway=='home'),away=comp.competitors.find(c=>c.homeAway=='away'),st=comp.status.type,isLive=st.state=='in',isFT=st.state=='post',timeStr=isFT?'Final':isLive?st.detail.toUpperCase():new Date(ev.date).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' - '+new Date(ev.date).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}),scoreTxt=isLive||isFT?`${home.score} - ${away.score}`:'vs';return `<div class="match-card"><div class="match-teams"><div class="mt"><img src="${home.team.logo}"><span>${home.team.displayName}</span></div><div class="mt"><img src="${away.team.logo}"><span>${away.team.displayName}</span></div></div><div class="match-center"><div class="score ${isLive?'live':''}">${scoreTxt}</div><div class="status ${isLive?'live':''}">${isLive?'● '+timeStr:timeStr}</div></div></div>`}).join('');document.getElementById('partidos').innerHTML=html;}catch{}}cargarTabla(2026);cargarJornadaActual();setInterval(cargarJornadaActual,60000);
</script></body></html>
