<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALZONE_GO - Fútbol en estado puro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter}.bebas{font-family:Bebas Neue}</style>
</head>
<body class="bg-[#0A0A0A] text-white">
<!-- HEADER -->
<header class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-zinc-800">
  <div class="max-w-[1200px] mx-auto flex justify-between items-center p-4">
    <h1 class="bebas text-3xl tracking-widest">GOALZONE<span class="text-[#FF4D00]">_GO</span></h1>
    <div class="flex gap-2">
      <a href="https://www.tiktok.com/@goalzone_go" class="bg-white text-black px-4 py-2 rounded-full font-black text-sm">TIKTOK</a>
      <button onclick="setLang()" class="border border-zinc-700 px-3 py-2 rounded-full text-xs">ES / EN</button>
    </div>
  </div>
  <!-- LIGAS SCROLL -->
  <div class="flex gap-2 overflow-x-auto px-4 pb-3 max-w-[1200px] mx-auto no-scrollbar">
    <button onclick="load('esp.1','LaLiga')" class="liga-btn bg-[#FF4D00] px-5 py-2 rounded-full font-bold whitespace-nowrap">LaLiga</button>
    <button onclick="load('eng.1','Premier')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">Premier</button>
    <button onclick="load('ita.1','Serie A')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">Serie A</button>
    <button onclick="load('ger.1','Bundesliga')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">Bundesliga</button>
    <button onclick="load('fra.1','Ligue 1')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">Ligue 1</button>
    <button onclick="load('usa.1','MLS')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">MLS</button>
    <button onclick="load('uefa.champions','Champions')" class="liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap">UCL</button>
  </div>
</header>

<main class="max-w-[1200px] mx-auto p-4 grid lg:grid-cols-[1.2fr_0.8fr] gap-6">
  <!-- TABLA -->
  <div class="bg-[#141414] rounded-[24px] p-5 border border-zinc-800">
    <div class="flex justify-between items-center mb-4"><h2 id="liga-title" class="bebas text-4xl">LaLiga 26/27</h2><span id="upd" class="text-xs text-zinc-500"></span></div>
    <div id="tabla" class="space-y-2">Cargando clasificación real...</div>
  </div>
  <!-- PARTIDOS -->
  <div class="space-y-6">
    <div class="bg-[#141414] rounded-[24px] p-5 border border-zinc-800">
      <h3 class="bebas text-2xl mb-4">PRÓXIMOS PARTIDOS</h3>
      <div id="partidos" class="space-y-3"></div>
    </div>
    <div class="bg-[#FF4D00] rounded-[24px] p-6 text-black">
      <h3 class="bebas text-3xl leading-none">¿VIENES DE TIKTOK?</h3><p class="font-bold mt-2">Aquí tienes el resumen extendido del vídeo + datos en vivo.</p>
      <a href="https://www.tiktok.com/@goalzone_go" class="inline-block mt-4 bg-black text-white px-6 py-3 rounded-full font-black">SEGUIR EN TIKTOK →</a>
    </div>
  </div>
</main>

<script>
let currentLiga='esp.1';
const mapFiles={'esp.1':'laliga','eng.1':'premier','ita.1':'seriea','ger.1':'bundesliga','fra.1':'ligue1','usa.1':'mls','uefa.champions':'champions'};

async function load(liga, nombre){
  currentLiga=liga;
  document.getElementById('liga-title').innerText=nombre+' 26/27';
  document.querySelectorAll('.liga-btn').forEach(b=>b.className='liga-btn bg-zinc-800 px-5 py-2 rounded-full font-bold whitespace-nowrap');
  event.target.className='liga-btn bg-[#FF4D00] px-5 py-2 rounded-full font-bold whitespace-nowrap';

  // INTENTO CARGAR JSON LOCAL (TU AUTOMATIZACION)
  let file = mapFiles[liga]||'laliga';
  try{
    let r = await fetch(`./${file}-data.json?t=${Date.now()}`); let j=await r.json();
    document.getElementById('upd').innerText='Act: '+j.actualizado;
    document.getElementById('tabla').innerHTML=j.tabla.map(t=>`
      <div class="flex items-center justify-between bg-[#1E1E1E] p-3 rounded-xl">
        <div class="flex items-center gap-3"><span class="w-6 font-black text-zinc-500">${t.pos}</span><img src="${t.logo}" class="w-7 h-7"><span class="font-bold">${t.team}</span></div>
        <div class="flex gap-4 text-sm"><span class="text-zinc-400">${t.pj} PJ</span><span class="font-black text-[#FF4D00]">${t.pts} PTS</span></div>
      </div>`).join('');
  }catch(e){ document.getElementById('tabla').innerHTML='Aún no hay datos, el bot está actualizando...'; }

  try{
    let r2=await fetch(`./${file}-partidos.json?t=${Date.now()}`); let j2=await r2.json();
    document.getElementById('partidos').innerHTML=j2.partidos.map(p=>`
      <div class="flex justify-between items-center bg-[#1E1E1E] p-3 rounded-xl text-sm">
        <div class="flex items-center gap-2"><img src="${p.logoLocal}" class="w-5 h-5">${p.local}</div>
        <span class="bg-black px-2 py-1 rounded text-xs">${p.resultado}</span>
        <div class="flex items-center gap-2">${p.visitante}<img src="${p.logoVisitante}" class="w-5 h-5"></div>
      </div>`).join('') || 'Aún no hay partidos';
  }catch(e){}
}
load('esp.1','LaLiga');
function setLang(){ alert('Siguiente paso: activamos EN. De momento ES.'); }
</script>
</body>
</html>
