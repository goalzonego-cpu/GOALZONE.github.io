<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a;color:#fff;-webkit-font-smoothing:antialiased}
header{background:#000;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a;height:78px}
.logo img{height:72px;width:auto;transform:scale(1.15)}
.tiktok-mini{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #222;padding:8px 14px;border-radius:100px}
nav{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:12px;height:56px}
.nav-content{display:flex;gap:28px;padding:0 24px;flex:1;align-items:center}
.nav-content a{cursor:pointer;font-weight:700;color:#888;font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:18px 0 16px;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.nav-content a.active{color:#000;border-bottom:2px solid #E10600}
.nav-item-wrap{display:flex;align-items:center}
#compSelect{background:#fff;color:#000;font-weight:800;font-size:12px;letter-spacing:.8px;padding:18px 10px;border:none;outline:none;cursor:pointer}
.nav-search{display:none!important}
.mobile-lupa-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:none;background:transparent;cursor:pointer;margin-left:auto}
.mobile-lupa-btn svg{width:21px;height:21px;color:#000}
.hamburger{padding:18px 12px 18px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.hamburger span{width:22px;height:2px;background:#000;border-radius:2px;display:block}
.hero-wrap{max-width:1100px;margin:0 auto 28px;padding:0 24px}
.hero{position:relative;width:100%;height:380px;border-radius:18px;overflow:hidden;background:#111;border:1px solid #1a1a1a}
.hero img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity.8s}
.hero img.active{opacity:1}
.hero-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.hero-dots span{width:6px;height:6px;border-radius:100px;background:rgba(255,255,255,.5)}
.hero-dots span.active{background:#fff;width:18px}
.live-ticker-wrap{max-width:1100px;margin:14px auto 28px;padding:0 24px}
.live-ticker{background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 30px rgba(225,6,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.05);overflow-x:auto;scrollbar-width:none}
.live-ticker::-webkit-scrollbar{display:none}
.live-label{background:#E10600;color:#fff;font-size:10px;font-weight:900;padding:7px 12px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.live-scroll{display:flex;gap:20px;align-items:center}
.live-item{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap;color:#fff}
.live-item img{width:20px;height:20px;object-fit:contain;background:#fff;border-radius:50%;padding:2px;flex-shrink:0}
.live-item b{background:#D6FF00;color:#000;padding:3px 7px;border-radius:6px;font-size:12px;min-width:42px;text-align:center}
.dot{width:6px;height:6px;background:#E10600;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.sep{color:#222}
.live-item.next{color:#888}
.live-item.next b{background:#1a1a1a;color:#777}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;pointer-events:none;transition:.3s}
#overlay.show{opacity:1;pointer-events:auto}
#sideMenu{position:fixed;top:0;right:0;width:300px;height:100%;background:#fff;color:#000;z-index:30;transform:translateX(100%);transition:.3s;padding:24px}
#sideMenu.show{transform:translateX(0)}
#sideMenu h2{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:20px}
#sideMenu a{display:block;padding:14px 0;border-bottom:1px solid #eee;text-decoration:none;color:#000;font-weight:700;font-size:13px}
#sideMenu a small{display:block;color:#888;font-weight:400;font-size:11px;margin-top:3px}
.section{max-width:1100px;margin:0 auto 20px;padding:28px 24px;background:#111;border-radius:18px;border:1px solid #1a1a1a}
.section h2{font-size:20px;font-weight:800;margin-bottom:10px;color:#fff}
.section p{color:#aaa;font-size:14px;line-height:1.6}
.redes{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.redes a{background:#fff;color:#000;padding:10px 18px;border-radius:100px;text-decoration:none;font-weight:800;font-size:13px}
footer{background:#000;color:#666;text-align:center;padding:40px 20px;border-top:1px solid #1a1a1a}
.tiktok-btn{display:inline-block;background:#E10600;color:#fff;padding:12px 22px;border-radius:100px;text-decoration:none;font-weight:800;font-size:14px;margin-top:16px}
.about-grid{display:grid;grid-template-columns:1.15fr.85fr;gap:20px}
.about-text h2{font-size:26px;line-height:1.1;margin-bottom:16px}
.about-text p{color:#a8a8a8;font-size:14.5px;line-height:1.8;margin-bottom:14px}
.about-text b{color:#fff}
.carousel-about{position:relative;background:#000;border:1px solid #1a1a1a;border-radius:18px;overflow:hidden;height:420px}
.carousel-about img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity.7s}
.carousel-about img.active{opacity:1}
.tag-about{position:absolute;top:12px;left:12px;z-index:3;background:#fff;color:#000;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.dots-about{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.dots-about span{width:6px;height:6px;background:rgba(255,255,255,.4);border-radius:10px}
.dots-about span.active{background:#fff;width:18px}
.btn-about{display:inline-block;margin-top:16px;background:#fff;color:#000;padding:12px 22px;border-radius:100px;font-weight:800;text-decoration:none;font-size:13px}

/* BUSCADOR ESTILO GOOGLE NEGRO - COMO TU CAPTURA */
.search-modal{position:fixed;inset:0;z-index:9999;background:#202124;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.3s}
.search-modal.open{opacity:1;pointer-events:auto}
.search-modal.top{height:60px;display:flex;align-items:center;justify-content:flex-end;padding:0 20px}
.search-modal.top button{background:transparent;border:none;color:#e8eaed;font-size:20px;width:36px;height:36px;cursor:pointer}
.search-modal.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;margin-top:-80px}
.google-logo{color:#fff;font-size:52px;font-weight:400;letter-spacing:-2px;margin-bottom:28px;font-family:Arial,sans-serif}
.google-logo span{font-weight:400}
.search-box-google{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;height:46px;background:transparent;border:1px solid #5f6368;border-radius:24px;padding:0 16px 0 18px}
.search-box-google:hover{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:rgba(223,225,229,0)}
.search-box-google svg{width:16px;height:16px;color:#9aa0a6;flex-shrink:0}
.search-box-google input{flex:1;background:transparent;border:none;outline:none;color:#e8eaed;font-size:16px}
.search-box-google input::placeholder{color:#9aa0a6}
.google-btns{display:flex;gap:12px;margin-top:28px}
.google-btns button{background:#303134;border:1px solid #303134;color:#e8eaed;padding:10px 16px;border-radius:4px;font-size:14px;cursor:pointer}
.google-btns button:hover{border-color:#8ab4f8}
@media(max-width:700px){
.hero-wrap,.live-ticker-wrap{padding:0 14px}
.hero{height:190px}
.about-grid{grid-template-columns:1fr}
.carousel-about{height:380px}
.google-logo{font-size:38px}
.search-box-google{max-width:90%}
}
</style>
</head>
<body>
<header><div class="logo"><img src="IMG_3855.png" alt="GOALZONE"></div><a class="tiktok-mini" href="https://www.tiktok.com/@goalzone_go" target="_blank">TikTok →</a></header>
<nav>
<div class="nav-content">
<a id="btn-todas" class="active">ÚLTIMAS</a>
<div class="nav-item-wrap">
  <select id="compSelect" onchange="if(this.value){location.href=this.value}">
    <option value="">COMPETICIONES ▼</option>
    <option value="laliga.html">LaLiga</option>
    <option value="premier.html">Premier League</option>
    <option value="ligue1.html">Ligue 1</option>
    <option value="seriea.html">Serie A</option>
    <option value="bundesliga.html">Bundesliga</option>
  </select>
</div>
</div>
<button class="mobile-lupa-btn" id="mobileLupaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg></button>
<div class="hamburger" onclick="openMenu()"><span></span><span></span><span></span></div>
</nav>

<!-- BUSCADOR GOOGLE ESTILO -->
<div class="search-modal" id="searchModal">
  <div class="top"><button id="closeSearch">✕</button></div>
  <div class="main">
    <div class="google-logo">GOALZONE</div>
    <div class="search-box-google">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="buscadorMobile" type="text" placeholder="Buscar en GOALZONE">
    </div>
    <div class="google-btns">
      <button onclick="location.href='laliga.html'">LaLiga</button>
      <button onclick="location.href='premier.html'">Premier League</button>
    </div>
  </div>
</div>

<div id="overlay" onclick="closeMenu()"></div>
<div id="sideMenu">
<h2>MENÚ <span onclick="closeMenu()" style="cursor:pointer">✕</span></h2>
<a>ÚLTIMAS <small>Todo</small></a>
<a href="laliga.html">LALIGA <small>EA Sports</small></a>
<a href="premier.html">PREMIER <small>Premier League</small></a>
<a href="ligue1.html">LIGUE 1 <small>Francia</small></a>
<a href="seriea.html">SERIE A <small>Italia</small></a>
<a href="bundesliga.html">BUNDESLIGA <small>Alemania</small></a>
</div>

<div class="live-ticker-wrap">
  <div class="live-ticker">
    <span class="live-label" id="live-count">● CARGANDO 26/27...</span>
    <div class="live-scroll" id="live-scroll"></div>
  </div>
</div>
<div class="hero-wrap">
  <div class="hero" id="hero">
    <img class="active" src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1200">
    <img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=1200">
    <img src="https://images.unsplash.com/photo-1579952363873-27f3bfad9c0d?w=1200">
    <div class="hero-dots" id="dots"><span class="active"></span><span></span><span></span></div>
  </div>
</div>
<footer><p>© 2026 GOALZONE</p></footer>

<script>
function openMenu(){document.getElementById('sideMenu').classList.add('show');document.getElementById('overlay').classList.add('show')}
function closeMenu(){document.getElementById('sideMenu').classList.remove('show');document.getElementById('overlay').classList.remove('show')}
const mobileLupaBtn=document.getElementById('mobileLupaBtn');
const searchModal=document.getElementById('searchModal');
const closeSearch=document.getElementById('closeSearch');
const buscadorMobile=document.getElementById('buscadorMobile');
mobileLupaBtn.addEventListener('click',()=>{searchModal.classList.add('open');setTimeout(()=>buscadorMobile.focus(),100)});
closeSearch.addEventListener('click',()=>{searchModal.classList.remove('open')});
let idx=0;let heroImgs=document.querySelectorAll('#hero img');let heroDots=document.querySelectorAll('#dots span');
setInterval(()=>{heroImgs[idx].classList.remove('active');heroDots[idx].classList.remove('active');idx=(idx+1)%heroImgs.length;heroImgs[idx].classList.add('active');heroDots[idx].classList.add('active')},3500);
const LIGAS = {"esp.1":"LaLiga","eng.1":"Premier","ger.1":"Bundes","ita.1":"Serie A","fra.1":"Ligue 1"};
async function cargarLive(){
  let todos=[];
  for(let code in LIGAS){
    try{
      const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard`);
      const d=await r.json();
      if(!d.events) continue;
      d.events.forEach(ev=>{
        const comp=ev.competitions[0];
        const home=comp.competitors.find(c=>c.homeAway=='home');
        const away=comp.competitors.find(c=>c.homeAway=='away');
        todos.push({home:home.team.abbreviation,away:away.team.abbreviation,homeLogo:home.team.logo,awayLogo:away.team.logo,score:`${home.score} - ${away.score}`,clock:comp.status.displayClock || comp.status.type.shortDetail,state:comp.status.type.state,isLive:comp.status.type.state=='in'});
      });
    }catch(e){}
  }
  const live=todos.filter(x=>x.isLive);
  const proximos=todos.filter(x=>x.state=='pre').slice(0,10);
  document.getElementById('live-count').innerText=live.length>0?`● EN DIRECTO (${live.length})`:`● HOY 26/27`;
  let html="";
  if(live.length>0){
    html+=live.map(p=>`<span class="live-item"><span class="dot"></span><img src="${p.homeLogo}">${p.home} <b>${p.score}</b> <img src="${p.awayLogo}">${p.away}</span>`).join('<span class="sep">|</span>');
  }
  html+=proximos.map(p=>`<span class="live-item next"><img src="${p.homeLogo}">${p.home} <b>${p.score}</b> <img src="${p.awayLogo}">${p.away}</span>`).join('<span class="sep">|</span>');
  document.getElementById('live-scroll').innerHTML=html;
}
cargarLive();
</script>
</body>
</html>
