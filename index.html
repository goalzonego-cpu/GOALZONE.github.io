<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a}
header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo img{height:38px}
.tiktok-mini{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #222;padding:8px 14px;border-radius:100px}
nav{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.nav-content{max-width:1100px;margin:0 auto;display:flex;gap:28px;padding:0 24px;overflow:auto}
.nav-content a{cursor:pointer;font-weight:700;color:#888;font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:18px 0 16px;border-bottom:2px solid transparent;white-space:nowrap}
.nav-content a.active{color:#000;border-bottom:2px solid #E10600}
.search-wrap{max-width:1100px;margin:18px auto 0;padding:0 24px}
.search-wrap input{width:100%;padding:16px 20px;border-radius:12px;border:1px solid #1f1f1f;background:#141414;color:#fff;font-size:15px;outline:none}
/* CARRUSEL NUEVO */
.carousel-wrap{max-width:1100px;margin:16px auto 24px;padding:0 24px;overflow:hidden}
.carousel-track{display:flex;gap:12px;width:max-content;animation:scroll 35s linear infinite}
.carousel-track img{width:280px;height:160px;object-fit:cover;border-radius:14px;flex-shrink:0;border:1px solid #1a1a1a}
.carousel-wrap:hover .carousel-track{animation-play-state:paused}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

main{max-width:1100px;margin:0 auto 40px;padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border-radius:18px;border:1px solid #e9e9e9;padding:24px;display:flex;flex-direction:column;cursor:pointer}
.badge{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 8px;border-radius:6px;margin-bottom:14px;width:fit-content}
.card-laliga .badge{background:#ffeaea;color:#E10600}
.card-champions .badge{background:#eef2ff;color:#1020ff}
.card-premier .badge{background:#f3e8ff;color:#37003c}
.cal-btn{background:#000;color:#fff;border:1px solid #222;padding:6px 10px;border-radius:100px;font-size:10px;font-weight:700;text-decoration:none;margin-bottom:14px}
.league-logo{width:100%;height:110px;object-fit:contain;margin-bottom:18px;background:#f7f7f7;border-radius:14px;padding:12px}
.card h3{font-size:17px;font-weight:800;margin-bottom:6px;color:#000}
.card p{color:#777;font-size:13px;line-height:1.4}
footer{background:#000;color:#666;text-align:center;padding:40px 20px;border-top:1px solid #1a1a1a}
.tiktok-btn{display:inline-block;background:#E10600;color:#fff;padding:12px 22px;border-radius:100px;text-decoration:none;font-weight:800;font-size:14px;margin-top:16px}
@media(max-width:800px){main{grid-template-columns:1fr}.carousel-track img{width:200px;height:120px}}
</style>
</head>
<body>
<header><div class="logo"><img src="IMG_3855.png" alt="GOALZONE"></div><a class="tiktok-mini" href="https://www.tiktok.com/@goalzone_go" target="_blank">TikTok →</a></header>

<nav><div class="nav-content">
<a id="btn-todas" class="active" onclick="filtrar('todas')">ÚLTIMAS</a>
<a id="btn-laliga" onclick="filtrar('laliga')">LALIGA</a>
<a id="btn-champions" onclick="filtrar('champions')">CHAMPIONS</a>
<a id="btn-premier" onclick="filtrar('premier')">PREMIER</a>
</div></nav>

<div class="search-wrap"><input id="buscador" type="text" placeholder="Buscar equipo, jugador, competición..." onkeyup="buscar()"></div>

<!-- CARRUSEL DE IMÁGENES -->
<div class="carousel-wrap">
  <div class="carousel-track" id="track">
    <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=600">
    <img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=600">
    <img src="https://images.unsplash.com/photo-1579952363873-27f3bfad9c0d?w=600">
    <img src="https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?w=600">
    <img src="https://images.unsplash.com/photo-1553778263-73a83bab9b0c?w=600">
  </div>
</div>

<main id="grid">
<div class="card card-laliga" data-cat="laliga" onclick="location.href='laliga.html'">
<span class="badge">LaLiga</span>
<img class="league-logo" src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png">
<h3>LaLiga EA Sports</h3>
<p>Resultados, clasificación y última hora del fútbol español.</p>
</div
