<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premier 26/27 - GOALZONE</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}header{background:#000;padding:14px 20px}.card{background:#111;padding:20px;border-radius:16px;margin:16px}.row{display:grid;grid-template-columns:30px 1fr 50px 50px;padding:10px 0;border-bottom:1px solid #222}</style></head>
<body>
<header><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800">GOALZONE</a> - Premier</header>
<div id="tabla" class="card">Cargando tabla oficial...</div>
<script>
async function load(){
 let r = await fetch('./premier-data.json?t='+Date.now());
 let d = await r.json();
 let html = '<div class="row" style="color:#666"><div>#</div><div>Equipo</div><div>PJ</div><div>PTS</div></div>';
 d.tabla.forEach(e=>{
  html+=`<div class="row"><div>${e.pos}</div><div><b>${e.team}</b></div><div>${e.pj}</div><div><b>${e.pts}</b></div></div>`;
 });
 document.getElementById('tabla').innerHTML = html + `<p style="color:#666;font-size:11px;margin-top:15px">Actualizado: ${d.actualizado}</p>`;
}
load(); setInterval(load, 60000);
</script>
</body></html>
