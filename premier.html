<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Premier - GOALZONE</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #222;padding:8px 14px;border-radius:100px}.wrap{max-width:800px;margin:30px auto;padding:0 24px}.h{color:#fff;font-size:28px;font-weight:800;margin:20px 0}.news{background:#fff;border-radius:18px;border:1px solid #e9e9e9;padding:20px;margin-bottom:12px;display:block;text-decoration:none;cursor:pointer}.news span{font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px;background:#eaffea;color:#0a7a00}.news h4{color:#000;margin:12px 0 6px;font-size:16px;font-weight:800}
</style></head><body><header><div class="logo"><a href="index.html"><img src="IMG_3855.png"></a></div><a class="back" href="index.html">← Volver</a></header><div class="wrap"><h1 class="h">Premier League</h1><div id="feed" style="color:#fff">Cargando noticias...</div></div>
<script>
async function cargar(){
 try{
  const rss="https://as.com/rss/futbol/premier/";
  const api=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`;
  const r=await fetch(api); const d=await r.json();
  if(!d.items) throw new Error('no items');
  let h=""; d.items.slice(0,12).forEach(i=>{
    let img=i.enclosure?.link||'';
    let p=`titulo=${encodeURIComponent(i.title)}&resumen=${encodeURIComponent(i.description)}&foto=${encodeURIComponent(img)}&link=${encodeURIComponent(i.link)}&cat=PREMIER`;
    h+=`<div class="news" onclick="location.href='noticia.html?${p}'"><span>AS • PREMIER</span><h4>${i.title}</h4><p style="color:#888;font-size:12px;margin-top:6px">Ver en plantilla GOALZONE →</p></div>`;
  });
  document.getElementById('feed').innerHTML=h;
 }catch(e){
  document.getElementById('feed').innerHTML=`<div class="news"><span>AS • PREMIER</span><h4>Error temporal del RSS. Refresca en 1 min.</h4></div>`;
 }
}cargar();
</script></body></html>
