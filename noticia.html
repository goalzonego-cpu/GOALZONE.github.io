<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Noticia - GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #222;padding:8px 14px;border-radius:100px}.wrap{max-width:700px;margin:30px auto;padding:0 24px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #e9e9e9}.card img{width:100%;height:240px;object-fit:cover;background:#f5f5f5}.content{padding:22px}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px;background:#ffeaea;color:#E10600}.content h1{color:#000;font-size:21px;font-weight:800;margin:12px 0;line-height:1.2}.content p{color:#555;font-size:14px;line-height:1.6}.btn{display:block;text-align:center;background:#E10600;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:20px}

<body><header><div class="logo"><a href="index.html"><img src="IMG_3855.png"></a></div><a class="back" href="javascript:history.back()">← Volver</a></header>
<div class="wrap"><div class="card"><img id="foto"><div class="content"><span class="badge" id="cat">GOALZONE</span><h1 id="titulo">Cargando...</h1><p id="resumen"></p><a id="link" class="btn" target="_blank">Leer completo en AS →</a></div></div></div>
