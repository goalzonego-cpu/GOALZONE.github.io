<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Champions - GOALZONE</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0a0a0a}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #222;padding:8px 14px;border-radius:100px}.wrap{max-width:800px;margin:30px auto;padding:0 24px}.h{color:#fff;font-size:28px;font-weight:800;margin:20px 0}.news{background:#fff;border-radius:18px;padding:20px;margin-bottom:12px;cursor:pointer}.news span{font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px;background:#e0f0ff;color:#0047AB}.news h4{color:#000;margin:12px 0 6px;font-size:16px}
</style></head><body><header><a href="index.html" class="logo"><img src="IMG_3855.png"></a><a class="back" href="index.html">← Volver</a></header><div class="wrap"><h1 class="h">Champions League</h1><div id="feed" style="color:#fff">Cargando noticias...</div></div>
<script>
async function cargar(){
 try{
  const rssUrl="https://e00-marca.ue.r1.cloudfront.net/rss/futbol/champions-league.xml";
  const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`);
  const data=await res.json();
  const xml=new DOMParser().parseFromString(data.contents,"text/xml");
  const items=xml.querySelectorAll("item");
  let h="";
  items.forEach((it,i)=>{
    if(i>=12) return;
    let title=it.querySelector("title")?.textContent||"";
    let desc=it.querySelector("description")?.textContent||"";
    let link=it.querySelector("link")?.textContent||"";
    let img=it.querySelector("enclosure")?.getAttribute("url")||"";
    let p=`titulo=${encodeURIComponent(title)}&resumen=${encodeURIComponent(desc)}&foto=${encodeURIComponent(img)}&link=${encodeURIComponent(link)}&cat=CHAMPIONS`;
    h+=`<div class="news" onclick="location.href='noticia.html?${p}'"><span>MARCA • CHAMPIONS - Fuente oficial RSS</span><h4>${title}</h4><p style="color:#888;font-size:12px;margin-top:6px">Ver en plantilla GOALZONE →</p></div>`;
  });
  document.getElementById('feed').innerHTML=h||"No hay noticias ahora";
 }catch(e){
  document.getElementById('feed').innerHTML=`<div style="color:#fff">Error cargando. Refresca en 10 segundos. ${e}</div>`;
 }
}
cargar();
</script></body></html>
