<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LaLiga 26/27 - GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff}
header{background:#000;padding:18px 24px;border-bottom:1px solid #1a1a1a}
header img{height:38px}
nav{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee;display:flex;gap:28px;padding:0 24px;overflow:auto}
nav a{font-weight:700;color:#888;font-size:12px;padding:18px 0;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap}
nav a.active{color:#000;border-bottom:2px solid #E10600}
.wrap{max-width:1100px;margin:20px auto;padding:0 24px}
.top-card{background:#fff;color:#000;border-radius:18px;padding:20px;display:flex;gap:16px;align-items:center}
.tabs{display:flex;gap:10px;overflow:auto;margin:20px 0;padding-bottom:4px}
.tabs button{background:#111;border:1px solid #222;color:#888;padding:12px 20px;border-radius:100px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.tabs button.active{background:#fff;color:#000}
.section{background:#111;border:1px solid #1a1a1a;border-radius:18px;padding:18px;margin-bottom:16px}
.jornada{background:#000;border:1px solid #222;border-radius:14px;margin-bottom:10px;overflow:hidden}
.jornada-head{padding:14px 18px;background:#151515;display:flex;justify-content:space-between;cursor:pointer;font-weight:800;font-size:13px}
.jornada-body{padding:8px 12px;display:none}
.jornada.open .jornada-body{display:block}
.partido{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px solid #151515;font-size:13px}
.partido:last-child{border:none}
.marcador{font-weight:800;background:#fff;color:#000;padding:4px 10px;border-radius:100px;font-size:12px;min-width:60px;text-align:center}
.cal-partido{background:#000;border:1px solid #222;border-radius:12px;padding:14px;display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
</style>
</head>
<body>
<header><a href="index.html"><img src="IMG_3855.png"></a></header>
<nav>
<a href="index.html">ÚLTIMAS</a>
<a class="active">LALIGA 26/27</a>
<a href="champions.html">CHAMPIONS</a>
<a href="premier.html">PREMIER</a>
</nav>

<div class="wrap">
  <div class="top-card">
    <img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png" style="width:60px">
    <div><h1 style="font-size:19px">LaLiga EA Sports 26/27</h1><p style="color:#666;font-size:12px">Resultados por jornada y calendario completo</p></div>
  </div>

  <div class="tabs">
    <button class="active" onclick="showTab('resultados',this)">RESULTADOS - 38 JORNADAS</button>
    <button onclick="showTab('calendario',this)">CALENDARIO OFICIAL</button>
    <button onclick="showTab('equipos',this)">EQUIPOS</button>
  </div>

  <div id="tab-resultados" class="section"><div id="jornadas-list"></div></div>
  <div id="tab-calendario" class="section" style="display:none"><div id="calendario-list"></div></div>
  <div id="tab-equipos" class="section" style="display:none">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Real Madrid</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Barcelona</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Atlético</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Athletic Club</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Villarreal</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Betis</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Valencia</div>
      <div style="background:#fff;color:#000;padding:14px;border-radius:12px;font-size:13px;font-weight:800">Sevilla</div>
    </div>
  </div>
</div>

<script>
function showTab(id,btn){
  document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');
  document.getElementById('tab-'+id).style.display='block';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleJornada(el){el.parentElement.classList.toggle('open')}

const equipos = ["Real Madrid","Barcelona","Atlético","Athletic","Villarreal","Betis","Valencia","Sevilla","Real Sociedad","Osasuna","Celta","Rayo","Getafe","Mallorca","Girona","Alavés","Leganés","Espanyol","Valladolid","Las Palmas"];

const jornadasList = document.getElementById('jornadas-list');
const calendarioList = document.getElementById('calendario-list');

let htmlJornadas = "";
let htmlCal = "";

for(let j=1;j<=38;j++){
  // Genera 10 partidos por jornada (rotación simple para demo legal)
  let partidos = [];
  for(let p=0;p<10;p++){
    let local = equipos[(j+p)%20];
    let visitante = equipos[(j+p+10)%20];
    partidos.push({local, visitante});
  }

  htmlJornadas += `<div class="jornada ${j===1?'open':''}">
    <div class="jornada-head" onclick="toggleJornada(this)"><span>JORNADA ${j}</span><span>${j===1?'▲':'▼'}</span></div>
    <div class="jornada-body">`;
  
  partidos.forEach(m=>{
    // Cuando empiece la liga cambias "vs" por resultado real ej: 2-1
    htmlJornadas += `<div class="partido"><span>${m.local} vs ${m.visitante}</span><span class="marcador">vs</span></div>`;
    // Para calendario
    if(j<=10){ // muestra primeras jornadas en calendario
      htmlCal += `<div class="cal-partido"><span>J${j} · ${m.local} vs ${m.visitante}</span><span style="color:#888">15-17 Ago</span></div>`;
    }
  });

  htmlJornadas += `</div></div>`;
}

jornadasList.innerHTML = htmlJornadas;
calendarioList.innerHTML = htmlCal + `<p style="color:#666;font-size:11px;margin-top:12px">*Cuando tengas resultados reales, solo cambias 'vs' por '2-1'. Para automatizarlo 100% luego lo conectamos a un Google Sheet tuyo y se actualiza solo sin API.</p>`;

</script>
</body>
</html>
