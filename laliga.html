<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaLiga - GOALZONE</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter;background:#0a0a0a;color:#fff}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back{color:#fff;text-decoration:none;font-size:13px;border:1px solid #222;padding:8px 14px;border-radius:100px}.wrap{max-width:900px;margin:24px auto;padding:0 24px}
.cal{background:#fff;border-radius:18px;padding:20px;color:#000}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cal-head h2{font-size:18px;font-weight:800;text-transform:capitalize}.cal-head button{background:#000;color:#fff;border:none;width:32px;height:32px;border-radius:100px;cursor:pointer}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#999;font-weight:700;margin-bottom:6px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days div{height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;border:1px solid #f0f0f0}.days div.today{background:#E10600;color:#fff;font-weight:800;border-color:#E10600}
.iframe-wrap{margin-top:18px;border-radius:18px;overflow:hidden;border:1px solid #1a1a1a;background:#fff}.iframe-wrap iframe{width:100%;height:700px;border:none}
</style></head><body>
<header><a href="index.html" class="logo"><img src="IMG_3855.png"></a><a class="back" href="index.html">← Volver</a></header>
<div class="wrap">
<div class="cal"><div class="cal-head"><button onclick="changeMonth(-1)">‹</button><h2 id="monthYear"></h2><button onclick="changeMonth(1)">›</button></div><div class="weekdays"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div><div class="days" id="days"></div></div>
<div class="iframe-wrap"><iframe src="https://www.marca.com/futbol/laliga/calendario.html"></iframe></div>
</div>
<script>
let cur=new Date();
function renderCal(){
  let y=cur.getFullYear(), m=cur.getMonth();
  document.getElementById('monthYear').innerText=new Date(y,m).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let first=new Date(y,m,1).getDay(); first=first==0?6:first-1;
  let daysIn=new Date(y,m+1,0).getDate();
  let html='';
  for(let i=0;i<first;i++) html+='<div></div>';
  for(let d=1;d<=daysIn;d++){
    let isToday=new Date().getDate()==d && new Date().getMonth()==m && new Date().getFullYear()==y;
    html+='<div class="'+(isToday?'today':'')+'">'+d+'</div>';
  }
  document.getElementById('days').innerHTML=html;
}
function changeMonth(v){cur.setMonth(cur.getMonth()+v);renderCal();}
renderCal();
</script></body></html>
