<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LaLiga - GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff}
header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
header img{height:38px}
nav{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee;display:flex;gap:28px;padding:0 24px;overflow:auto}
nav a{font-weight:700;color:#888;font-size:12px;padding:18px 0;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap}
nav a.active{color:#000;border-bottom:2px solid #E10600}
.wrap{max-width:900px;margin:24px auto;padding:0 20px}
.hero{background:#fff;color:#000;border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;border:1px solid #e9e9e9}
.hero img{width:64px;height:64px;object-fit:contain}
.hero h1{font-size:20px;font-weight:800}.hero p{font-size:12px;color:#666;margin-top:4px}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:700px){.feed{grid-template-columns:1fr}}
.tiktok-card{background:#fff;border-radius:18px;border:1px solid #e9e9e9;overflow:hidden;display:flex;flex-direction:column}
.tiktok-card .top{padding:14px 16px}
.badge{font-size:9px;font-weight:800;background:#ffeaea;color:#E10600;padding:5px 8px;border-radius:6px;width:fit-content;margin-bottom:8px;letter-spacing:.5px}
.tiktok-card h3{color:#000;font-size:14px;font-weight:800;line-height:1.3}
.tiktok-card p{color:#666;font-size:12px;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tiktok-card .meta{font-size:10px;color:#999;margin-top:8px;font-weight:600}
.tiktok-card .embed{ background:#000; min-height:400px; display:flex; align-items:center; justify-content:center }
.tiktok-card .embed blockquote{margin:0}
</style>
</head>
<body>
<header><a href="index.html"><img src="IMG_3855.png"></a></header>
<nav>
<a href="index.html">ÚLTIMAS</a>
<a class="active">LALIGA</a>
<a href="champions.html">CHAMPIONS</a>
<a href="premier.html">PREMIER</a>
</nav>
<div class="wrap">
  <div class="hero">
    <img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png">
    <div><h1>LaLiga en GOALZONE</h1><p>Todos tus TikToks de @Goalzone_go sobre LaLiga ordenados profesionalmente</p></div>
  </div>
  <div id="feed" class="feed"></div>
</div>

<script>
async function load(){
  try{
    let r = await fetch('videos.json?v='+Date.now());
    let videos = await r.json();
    // Orden profesional: más nuevo primero
    videos.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    let html="";
    videos.forEach(v=>{
      if(!v.desc.toLowerCase().includes('laliga')) return;
      html+=`<div class="tiktok-card">
        <div class="top">
          <div class="badge">LALIGA · TIKTOK</div>
          <h3>${v.title}</h3>
          <p>${v.desc}</p>
          <div class="meta">${v.date||'Reciente'} · @Goalzone_go</div>
        </div>
        <div class="embed">
          <blockquote class="tiktok-embed" cite="${v.url}" data-video-id="${v.id}" style="max-width:100%;min-width:325px"><a href="${v.url}"></a></blockquote>
        </div>
      </div>`;
    });
    document.getElementById('feed').innerHTML = html || "<p style='color:#666'>Aún no hay vídeos con #LaLiga</p>";
    let s=document.createElement('script'); s.src='https://www.tiktok.com/embed.js'; document.body.appendChild(s);
  }catch(e){
    document.getElementById('feed').innerHTML="<div style='background:#fff;color:#000;padding:20px;border-radius:18px'>Crea el archivo videos.json al lado de este html con tus links</div>";
  }
}
load();
</script>
</body>
</html>
