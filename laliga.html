<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LaLiga 26/27 | GOALZONE</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a;color:#fff}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.nav-content{display:flex;gap:28px;padding:0 24px;overflow:visible;align-items:center}nav{background:#fff;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between}.nav-content a{font-weight:700;color:#888;font-size:12px;padding:18px 0 16px;border-bottom:2px solid transparent;text-decoration:none;cursor:pointer}.nav-content a.active{color:#000;border-bottom:2px solid #E10600}.comp-dropdown{position:absolute;top:100%;left:-10px;background:#111;border:1px solid #222;border-radius:16px;padding:8px;min-width:220px;display:none;flex-direction:column;z-index:100}.comp-dropdown.show{display:flex!important}.comp-dropdown a{color:#fff!important;padding:12px!important}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;pointer-events:none}#overlay.show{opacity:1;pointer-events:auto}#sideMenu{position:fixed;top:0;right:0;width:300px;height:100%;background:#fff;color:#000;z-index:30;transform:translateX(100%);transition:.3s;padding:24px}#sideMenu.show{transform:translateX(0)}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top-bar{display:flex;gap:12px;align-items:center;margin:24px 0}.top-bar img{width:48px;height:48px;background:#fff;border-radius:12px;padding:6px}.badge{background:#ffeaea;color:#E10600;font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px}.season-bar{display:flex;gap:12px;align-items:center;background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:12px 16px;margin-bottom:18px}.season-bar select{background:#000;color:#fff;border:1px solid #222;border-radius:100px;padding:10px 16px;font-weight:700}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.box{background:#111;border:1px solid #1a1a1a;border-radius:18px;padding:22px}.table-row{display:grid;grid-template-columns:28px 1fr 30px 30px;font-size:13px;padding:10px 0;border-bottom:1px solid #1a1a1a;align-items:center}.team{display:flex;gap:8px;align-items:center}.team img{width:20px;height:20px;background:#fff;border-radius:100px;padding:2px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo"><a href="index.html"><img src="IMG_3855.png"></a></div><a href="https://www.tiktok.com/@goalzone_go" target="_blank" style="color:#fff;text-decoration:none;border:1px solid #222;padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600">TikTok →</a></header>
<nav><div class="nav-content"><a href="index.html">ÚLTIMAS</a><div style="position:relative" id="compWrap"><a onclick="toggleComp(event)">COMPETICIONES ▼</a><div class="comp-dropdown" id="compDropdown"><a href="laliga.html">LaLiga ESP</a><a href="premier.html">Premier ENG</a><a href="ligue1.html">Ligue 1 FRA</a><a href="seriea.html">Serie A ITA</a><a href="bundesliga.html">Bundesliga GER</a></div></div></div><div onclick="openMenu()" style="padding:18px 24px;cursor:pointer">☰</div></nav>
<div id="overlay" onclick="closeMenu()"></div><div id="sideMenu"><h2>MENÚ <span onclick="closeMenu()">✕</span></h2><a href="laliga.html">LALIGA</a><a href="premier.html">PREMIER</a><a href="ligue1.html">LIGUE 1</a><a href="seriea.html">SERIE A</a><a href="bundesliga.html">BUNDESLIGA</a></div>
<div class="wrap"><div class="top-bar"><img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png"><div><span class="badge">LaLiga</span><h1>LaLiga EA Sports 26/27</h1></div></div>
<div class="season-bar"><span style="font-size:11px;font-weight:800">ELIGE TEMPORADA:</span><select id="seasonSelect" onchange="cambiarTemporada()"></select><span id="loader" style="font-size:12px;color:#888;display:none">Cargando...</span></div>
<div class="grid"><div class="box"><h2 style="font-size:13px;margin-bottom:14px">PARTIDOS</h2><div id="partidos">Cargando...</div></div><div class="box"><h2 style="font-size:13px;margin-bottom:14px">CLASIFICACIÓN <span id="tempLabel">26/27 - EN VIVO</span></h2><div class="table-row" style="color:#666;font-size:11px"><span>#</span><span>Equipo</span><span>PJ</span><span>PTS</span></div><div id="tabla"></div></div></div></div>
<script>
const LIGA_CODE='esp.1'; const DATA_FILE='laliga-data.json'; const PARTIDOS_FILE='laliga-partidos.json';
function openMenu(){document.getElementById('sideMenu').classList.add('show');document.getElementById('overlay').classList.add('show')}
function closeMenu(){document.getElementById('sideMenu').classList.remove('show');document.getElementById('overlay').classList.remove('show');document.getElementById('compDropdown').classList.remove('show')}
function toggleComp(e){e.stopPropagation();document.getElementById('compDropdown').classList.toggle('show');document.getElementById('overlay').classList.add('show')}
const sel=document.getElementById('seasonSelect'); for(let y=2026;y>=2000;y--){let o=document.createElement('option');o.value=y;o.text=y+'/'+String(y+1).slice(-2);if(y==2026)o.selected=true;sel.appendChild(o);}
async function cargarActual(){try{let j=await (await fetch(DATA_FILE)).json();pintar(j.tabla);}catch{}}
function pintar(tabla){document.getElementById('tabla').innerHTML=tabla.map(r=>`<div class="table-row"><span>${r.pos}</span><div class="team"><img src="${r.logo}"><span>${r.team}</span></div><span>${r.pj}</span><span><b>${r.pts}</b></span></div>`).join('')}
async function cambiarTemporada(){let season=sel.value;document.getElementById('loader').style.display='inline';document.getElementById('tempLabel').innerText=season+'/'+String(parseInt(season)+1).slice(-2);if(season=='2026'){await cargarActual();document.getElementById('tempLabel').innerText='26/27 - EN VIVO';document.getElementById('loader').style.display='none';return;}try{let j=await (await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${LIGA_CODE}/standings?season=${season}`)).json();let entries=j.children[0].standings.entries;let tabla=entries.map(e=>{let s=Object.fromEntries(e.stats.map(x=>[x.name,x.value]));return {pos:s.rank,team:e.team.displayName,logo:e.team.logos?.[0]?.href||'',pj:s.gamesPlayed,pts:s.points}}).sort((a,b)=>a.pos-b.pos);pintar(tabla);}catch(e){document.getElementById('tabla').innerHTML='Sin datos para esa temporada';}document.getElementById('loader').style.display='none';}
cargarActual(); fetch(PARTIDOS_FILE).then(r=>r.json()).then(j=>{document.getElementById('partidos').innerHTML=j.partidos.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e1e1e"><b style="font-size:13px">${p.local} vs ${p.visitante}</b><span style="background:#1a1a1a;padding:4px 10px;border-radius:100px;font-size:12px">${p.resultado||p.hora}</span></div>`).join('')}).catch(()=>{});
</script></body></html>
