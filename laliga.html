<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LaLiga 26/27 | GOALZONE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a;color:#fff}
header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo img{height:38px}
nav{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee;display:flex;align-items:center}
.nav-content{padding:0 24px}
.back-btn{display:flex;align-items:center;gap:6px;color:#000!important;font-weight:800!important;font-size:13px!important;text-decoration:none;padding:18px 0}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.top-bar{display:flex;gap:12px;align-items:center;margin:24px 0}
.top-bar img{width:48px;height:48px;background:#fff;border-radius:12px;padding:6px}
.badge{background:#ffeaea;color:#E10600;font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px}
.season-bar{display:flex;gap:12px;align-items:center;background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:12px 16px;margin-bottom:18px}
.season-bar select{background:#000;color:#fff;border:1px solid #222;border-radius:100px;padding:10px 16px;font-weight:700}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.box{background:#111;border:1px solid #1a1a1a;border-radius:18px;padding:22px}
.table-row{display:grid;grid-template-columns:28px 1fr 30px 30px;font-size:13px;padding:10px 0;border-bottom:1px solid #1a1a1a;align-items:center}
.team{display:flex;gap:8px;align-items:center}.team img{width:20px;height:20px;background:#fff;border-radius:100px;padding:2px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo"><a href="index.html"><img src="IMG_3855.png"></a></div><a href="https://www.tiktok.com/@goalzone_go" target="_blank" style="color:#fff;text-decoration:none;border:1px solid #222;padding:8px 14px;border-radius:100px;font-size:13px">TikTok →</a></header>
<nav><div class="nav-content"><a href="index.html" class="back-btn">← BACK</a></div></nav>

<div class="wrap">
<div class="top-bar"><img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png"><div><span class="badge">LaLiga</span><h1 style="font-size:26px;font-weight:800">LaLiga EA Sports 26/27</h1></div></div>
<div class="season-bar"><span style="font-size:11px;font-weight:800">ELIGE TEMPORADA:</span><select id="seasonSelect" onchange="cambiarTemporada()"></select><span id="loader" style="display:none;color:#888;font-size:12px">Cargando...</span></div>
<div class="grid">
<div class="box"><h2 style="font-size:13px;margin-bottom:14px">PARTIDOS</h2><div id="partidos">Cargando...</div></div>
<div class="box"><h2 style="font-size:13px;margin-bottom:14px">CLASIFICACIÓN <span id="tempLabel">26/27 - EN VIVO</span></h2><div class="table-row" style="color:#666;font-size:11px"><span>#</span><span>Equipo</span><span>PJ</span><span>PTS</span></div><div id="tabla"></div></div>
</div>
</div>

<script>
const LIGA_CODE='esp.1'; const DATA_FILE='laliga-data.json'; const PARTIDOS_FILE='laliga-partidos.json';
const sel=document.getElementById('seasonSelect');
for(let y=2026;y>=2000;y--){let o=document.createElement('option');o.value=y;o.text=y+'/'+String(y+1).slice(-2);if(y==2026)o.selected=true;sel.appendChild(o);}
function pintar(t){document.getElementById('tabla').innerHTML=t.map(r=>`<div class="table-row"><span>${r.pos}</span><div class="team"><img src="${r.logo}"><span>${r.team}</span></div><span>${r.pj}</span><span><b>${r.pts}</b></span></div>`).join('')}
async function cargarActual(){let j=await (await fetch(DATA_FILE)).json();pintar(j.tabla)}
async function cambiarTemporada(){
 let s=sel.value;document.getElementById('loader').style.display='inline';
 document.getElementById('tempLabel').innerText=s+'/'+String(parseInt(s)+1).slice(-2);
 if(s=='2026'){await cargarActual();document.getElementById('tempLabel').innerText='26/27 - EN VIVO';document.getElementById('loader').style.display='none';return;}
 try{
  let j=await (await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${LIGA_CODE}/standings?season=${s}`)).json();
  let tabla=j.children[0].standings.entries.map(e=>{let st=Object.fromEntries(e.stats.map(x=>[x.name,x.value]));return{pos:st.rank,team:e.team.displayName,logo:e.team.logos?.[0]?.href||'',pj:st.gamesPlayed,pts:st.points}}).sort((a,b)=>a.pos-b.pos);
  pintar(tabla);
 }catch{document.getElementById('tabla').innerHTML='Sin datos para esa temporada'}
 document.getElementById('loader').style.display='none';
}
cargarActual();
fetch(PARTIDOS_FILE).then(r=>r.json()).then(j=>{document.getElementById('partidos').innerHTML=j.partidos.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e1e1e"><b>${p.local} vs ${p.visitante}</b><span style="background:#1a1a1a;padding:4px 10px;border-radius:100px;font-size:12px">${p.resultado||p.hora}</span></div>`).join('')})
</script>
</body>
</html>
