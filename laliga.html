<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LaLiga 26/27 | GOALZONE</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;background:#0a0a0a;color:#fff}header{background:#000;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}.logo img{height:38px}.back-top{color:#fff;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #333;padding:10px 18px;border-radius:100px;background:#111}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top-bar{display:flex;gap:12px;align-items:center;margin:24px 0}.top-bar img{width:52px;height:52px;background:#fff;border-radius:14px;padding:7px}.season-bar{display:flex;gap:12px;align-items:center;background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}.season-bar select{background:#000;color:#fff;border:1px solid #333;border-radius:100px;padding:10px 18px;font-weight:700}.grid{display:grid;grid-template-columns:1.2fr.8fr;gap:18px}.box{background:#111;border:1px solid #1a1a1a;border-radius:18px;padding:22px}.table-row{display:grid;grid-template-columns:30px 1fr 40px 45px;font-size:13.5px;padding:11px 0;border-bottom:1px solid #1e1e1e;align-items:center}.team{display:flex;gap:10px;align-items:center}.team img{width:22px;height:22px;background:#fff;border-radius:100px;padding:2px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a href="index.html" class="logo"><img src="IMG_3855.png"></a><a href="index.html" class="back-top">← BACK</a></header>
<div class="wrap"><div class="top-bar"><img src="https://a3.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png"><div><h1 style="font-size:27px;font-weight:800">LaLiga EA Sports 26/27</h1><p style="color:#888;font-size:13px">Clasificación real - fuente ESPN (misma que Google)</p></div></div>
<div class="season-bar"><span style="font-size:11px;font-weight:800">ELIGE TEMPORADA:</span><select id="seasonSelect" onchange="cambiarTemporada()"></select><span id="loader" style="display:none;color:#E10600;font-size:12px;font-weight:700">● Cargando...</span><span id="actualizado" style="margin-left:auto;color:#555;font-size:11px"></span></div>
<div class="grid"><div class="box"><h2 style="font-size:13px;margin-bottom:14px">RESULTADOS Y PARTIDOS</h2><div id="partidos"></div></div><div class="box"><h2 style="font-size:13px;margin-bottom:14px">CLASIFICACIÓN <span id="tempLabel" style="color:#E10600">26/27 EN VIVO</span></h2><div class="table-row" style="color:#666;font-size:11px"><span>#</span><span>Equipo</span><span>PJ</span><span>PTS</span></div><div id="tabla">Cargando clasificación...</div></div></div></div>
<script>
const LIGA_CODE='esp.1', DATA_FILE='laliga-data.json', PARTIDOS_FILE='laliga-partidos.json';
const sel=document.getElementById('seasonSelect');
for(let y=2026;y>=2000;y--){let o=document.createElement('option');o.value=y;o.text=y+'/'+String(y+1).slice(-2);if(y==2026)o.selected=true;sel.appendChild(o);}
function pintar(tabla,act){document.getElementById('tabla').innerHTML=tabla.map(r=>`<div class="table-row"><span>${r.pos}</span><div class="team"><img src="${r.logo}" onerror="this.style.display='none'"><span>${r.team}</span></div><span>${r.pj}</span><span><b>${r.pts}</b></span></div>`).join(''); if(act) document.getElementById('actualizado').innerText='Actualizado: '+act;}
async function cargarActual(){
 try{
  let j=await (await fetch(DATA_FILE+'?t='+Date.now())).json();
  if(j.tabla && j.tabla.length>0){pintar(j.tabla,j.actualizado); return true;}
 }catch{}
 // Fallback directo a ESPN si no hay JSON aún
 try{
  let r=await (await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${LIGA_CODE}/standings`)).json();
  let entries=r.children[0].standings.entries;
  let tabla=entries.map(e=>{let s=Object.fromEntries(e.stats.map(x=>[x.name,x.value]));return{pos:s.rank,team:e.team.displayName,logo:e.team.logos?.[0]?.href||'',pj:s.gamesPlayed,pts:s.points}}).sort((a,b)=>a.pos-b.pos);
  pintar(tabla,'EN VIVO ESPN'); return true;
 }catch{ document.getElementById('tabla').innerHTML='Ejecuta el workflow una vez para cargar datos'; return false;}
}
async function cambiarTemporada(){
 let s=sel.value; document.getElementById('loader').style.display='inline';
 document.getElementById('tempLabel').innerText=s+'/'+String(parseInt(s)+1).slice(-2);
 if(s=='2026'){await cargarActual();document.getElementById('tempLabel').innerText='26/27 EN VIVO';document.getElementById('loader').style.display='none';cargarPartidos();return;}
 try{
  let j=await (await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${LIGA_CODE}/standings?season=${s}`)).json();
  let entries=j.children[0].standings.entries;
  let tabla=entries.map(e=>{let st=Object.fromEntries(e.stats.map(x=>[x.name,x.value]));return{pos:st.rank,team:e.team.displayName,logo:e.team.logos?.[0]?.href||'',pj:st.gamesPlayed,pts:st.points}}).sort((a,b)=>a.pos-b.pos);
  pintar(tabla, s+'/'+String(parseInt(s)+1).slice(-2));
 }catch{ document.getElementById('tabla').innerHTML='No hay datos para '+s+' en ESPN - Prueba 2023, 2022, etc.'; }
 document.getElementById('loader').style.display='none';
}
async function cargarPartidos(){
 try{
  let j=await (await fetch(PARTIDOS_FILE+'?t='+Date.now())).json();
  if(j.partidos && j.partidos.length>0){
   document.getElementById('partidos').innerHTML=j.partidos.map(p=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1e1e1e"><b style="font-size:13px">${p.local} vs ${p.visitante}</b><span style="background:#1e1e1e;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:700">${p.resultado||p.hora||'-'}</span></div>`).join('');
   return;
  }
 }catch{}
 document.getElementById('partidos').innerHTML='Sin partidos esta semana - Se actualiza cada 3h';
}
cargarActual(); cargarPartidos();
</script></body></html>
